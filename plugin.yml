name: KetSat
main: PlayerVaults\PlayerVaults
api: 5.0.0
version: 3.0.0
authors:
  - Muqsit (PlayerVaults upstream)
  - Ghast Moob (manifest edit attribution)
  - Ghast Noob (config edit attribution)
  - NhanAZ (Axolotl-PM API 5 port)
description: Personal item vaults with legacy JSON and YAML data support
website: https://github.com/NhanAZ-Plugins/Ket_Sat
commands:
  ketsat:
    description: Open a personal item vault
    usage: "/ketsat <number|help>"
    aliases: [ks]
    permission: ketsat.command
permissions:
  ketsat.command:
    default: true
  ketsat.admin:
    default: op
